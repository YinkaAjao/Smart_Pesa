name: smart_pesa
description: Smart-Pesa mobile application frontend with Flutter + BLoC

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation & DI
  go_router: ^17.0.0
  get_it: ^7.6.4
  dartz: ^0.10.1

  # UI
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true