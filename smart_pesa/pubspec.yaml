name: smart_pesa
description: Smart-Pesa mobile application frontend with Flutter + BLoC

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  fl_chart: ^1.1.1
  google_fonts: ^6.3.2
  go_router: ^17.0.0
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  firebase_core_platform_interface: 5.4.2
  firebase_auth_platform_interface: 7.3.0
  cloud_firestore_platform_interface: 6.2.5
  firebase_core_web: 2.24.0
  firebase_auth_web: 5.8.13
  cloud_firestore_web: 3.12.5

flutter:
  uses-material-design: true