name: smart_pesa
description: Smart-Pesa mobile application frontend with Flutter + BLoC

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  fl_chart: ^1.1.1
  google_fonts: ^6.3.2
  go_router: ^17.0.0

  # Updated Firebase dependencies (NO overrides needed)
  firebase_core: ^3.8.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
